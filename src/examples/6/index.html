<!DOCTYPE html>
<html class="no-js" lang="">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="description" content="Poker HUD 1" />

        <link rel="stylesheet" href="board.css" />
        <link rel="stylesheet" href="player.css" />
        <link rel="stylesheet" href="pot.css" />

        <title>Poker HUD - 6</title>
    </head>

    <body style="background-color: lightgray;">
        <h1>Poker HUD - 6</h1>

        <h2>Board</h2>
        <!-- <img src="../../images/examples/Board_6.png" alt="Board 6" /> -->
        <p>No <strong>Board</strong> to copy</p>

        <hr />

        <h2>Player</h2>
        <img src="../../images/examples/Players_6.png" alt="Players 6" />

        <div class="players_6">
            <div class="player_6">
                <div class="player-cards">
                    <img src="../../images/cards/10-heart.png" alt="Ten of hearts" />
                    <img src="../../images/cards/10-club.png" alt="Ten of clubs" />
                </div>
                <span class="pot-odds">54%</span>
                <div class="player-name">LADOUCEUR</div>
                <div class="player-action">CALL 415,000</div>
            </div>
            <div class="player_6">
                <div class="player-cards">
                    <img src="../../images/cards/13-heart.png" alt="King of hearts" />
                    <img src="../../images/cards/12-heart.png" alt="Queen of hearts" />
                </div>
                <span class="pot-odds">46%</span>
                <div class="player-name">WAISON</div>
                <div class="player-action all-in">RAISE ALL-IN 575,000</div>
            </div>
        </div>

        <hr />

        <h2>Pot</h2>
        <img src="../../images/examples/Pot_6.png" alt="Pot 6" />

        <div class="pot_6">
            <span class="pot-label">POT</span>
            <span class="pot-amount">990,000</span>
        </div>

    </body>
</html>
