<!DOCTYPE html>
<html class="no-js" lang="">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="description" content="Poker HUD 2" />

        <link rel="stylesheet" href="board.css" />
        <link rel="stylesheet" href="player.css" />
        <link rel="stylesheet" href="pot.css" />

        <title>Poker HUD - HUD 2</title>
    </head>

    <body style="background-color: lightgray;">
        <h1>Poker HUD - HUD 2</h1>

        <h2>Board</h2>
        <img src="https://github.com/user-attachments/assets/d96a8298-ddf0-4f97-8626-3e6b87d4cdf3" alt="Board HUD 2" />

        <div class="board-container">
            <div class="f1">
                <img src="../../images/cards/10-club.png" alt="Flop 1" class="board-card" />
            </div>
            <div class="f2">
                <img src="../../images/cards/9-heart.png" alt="Flop 2" class="board-card" />
            </div>
            <div class="f3">
                <img src="../../images/cards/7-heart.png" alt="Flop 3" class="board-card" />
            </div>
            <div class="t">
                <img src="../../images/cards/2-diamond.png" alt="Turn" class="board-card" />
            </div>
            <div class="r"></div>
            <div class="flop info">FLOP</div>
            <div class="turn info">TURN</div>
            <div class="river info">RIVER</div>
        </div>

        <hr />

        <h2>Player</h2>
        <img src="https://github.com/user-attachments/assets/3c1ab93f-f77e-471d-a5d1-1e664aeed4fe" alt="Players HUD 2" />

        <div class="players-container">
            <div class="player-row">
                <div class="player-cards">
                    <img src="../../images/cards/8-club.png" alt="Card 1" class="player-card" />
                    <img src="../../images/cards/6-club.png" alt="Card 2" class="player-card" />
                </div>
                <div class="player-details">
                    <div class="player-header">
                        <span class="player-name">IVEY</span>
                        <span class="player-odds">77%</span>
                    </div>
                    <div class="player-action call">CALL $57,300</div>
                </div>
            </div>
            <div class="player-row">
                <div class="player-cards">
                    <img src="../../images/cards/10-heart.png" alt="Card 1" class="player-card" />
                    <img src="../../images/cards/10-diamond.png" alt="Card 2" class="player-card" />
                </div>
                <div class="player-details">
                    <div class="player-header">
                        <span class="player-name">HELLMUTH</span>
                        <span class="player-odds">23%</span>
                    </div>
                    <div class="player-action all-in">ALL-IN $80,300</div>
                </div>
            </div>
        </div>

        <hr />

        <h2>Pot</h2>
        <img src="https://github.com/user-attachments/assets/fcc3ff12-0480-4c31-a38d-59cf40564503" alt="Pot HUD 2" />

        <div class="pot-container">
            <span class="pot-label">POT</span>
            <span class="pot-amount">$187,500</span>
        </div>

    </body>
</html>
