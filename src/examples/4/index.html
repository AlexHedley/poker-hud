<!DOCTYPE html>
<html class="no-js" lang="">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="description" content="Poker HUD 1" />

        <link rel="stylesheet" href="board.css" />
        <link rel="stylesheet" href="player.css" />
        <link rel="stylesheet" href="pot.css" />

        <title>Poker HUD - 4</title>
    </head>

    <body style="background-color: lightgray;">
        <h1>Poker HUD - 4</h1>

        <h2>Board / Pot</h2>
        <img src="../../images/examples/Board_4.png" alt="Board 4" />

        <div class="board_4">
            <div class="board-container">
                <div class="F1">
                    <img src="../../images/cards/2-diamond.png" width="50px" alt="Flop 1" class="card" />
                </div>
                <div class="F2">
                    <img src="../../images/cards/11-heart.png" width="50px" alt="Flop 2" class="card" />
                </div>
                <div class="F3">
                    <img src="../../images/cards/9-diamond.png" width="50px" alt="Flop 3" class="card" />
                </div>
                <div class="T">
                    <img src="../../images/cards/2-heart.png" width="50px" alt="Turn" class="card" />
                </div>
                <div class="R">
                    <img src="../../images/cards/14-diamond.png" width="50px" alt="River" class="card" />
                </div>
            </div>
            <div class="pot_4">
                <span>Blinds: $25/$50</span>
                <span class="pot">$3,050</span>
            </div>
        </div>

        <hr />

        <h2>Player</h2>
        <img src="../../images/examples/Players_4.png" alt="Players 4" />

        <div class="players_4">
            <div class="player_4">
                <div class="player-container">
                    <div class="ProfilePic">
                        <img src="../../images/examples/Players_4-P1.png" alt="Player 1" />
                    </div>
                    <div class="Card1">
                        <img src="../../images/cards/7-spade.png" alt="Card 1" width="50px" class="card" />
                    </div>
                    <div class="Card2">
                        <img src="../../images/cards/2-spade.png" alt="Card 2" width="50px" class="card" />
                    </div>
                    <div class="PotOdds">100%</div>
                    <div class="Name">Deeb</div>
                    <div class="Bet">Bet $1,300</div>
                </div>
            </div>
            <div class="player_4">
                <div class="player-container">
                    <div class="ProfilePic">
                        <img src="../../images/examples/Players_4-P2.png" alt="Player 2" />
                    </div>
                    <div class="Card1">
                        <img src="../../images/cards/10-club.png" alt="Card 1" width="50px" class="card" />
                    </div>
                    <div class="Card2">
                        <img src="../../images/cards/9-club.png" alt="Card 2" width="50px" class="card" />
                    </div>
                    <div class="PotOdds">0%</div>
                    <div class="Name">Schneider</div>
                    <div class="Bet">$1,300 to Call</div>
                </div>
            </div>
        </div>

        <hr />

        <h2>Screenshot</h2>
        <img src="../../images/examples/Screenshot_4.png" alt="Screenshot 4" />

    </body>
</html>
